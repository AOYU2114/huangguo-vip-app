yaml
name: Build APK

on:
  workflow_dispatch:  # 允许你在Actions页面手动触发这个工作流

jobs:
  build:
    runs-on: ubuntu-latest  # 使用 GitHub 提供的免费 Ubuntu 环境

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'  # Flutter 编译通常需要 JDK 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'  # 使用 Flutter 稳定版
          cache: true

      - name: Install dependencies
        run: flutter pub get  # 安装项目依赖

      - name: Build APK
        run: flutter build apk --release  # 编译 release 版本的 APK

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk  # 指定要上传的 APK 文件路径
